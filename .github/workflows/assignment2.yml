name: Assignment 2 CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "assignment2/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision-and-converge:
    name: Provision and Converge
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      ANSIBLE_CONFIG: assignment2/ansible/ansible.cfg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install Ansible, AWS collections, and Session Manager plugin
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible boto3 botocore
          ansible-galaxy collection install amazon.aws community.aws
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb

      - name: Terraform Init and Validate
        run: |
          terraform -chdir=assignment2/terraform init -input=false
          terraform -chdir=assignment2/terraform validate

      - name: Terraform Apply
        run: terraform -chdir=assignment2/terraform apply -auto-approve

      - name: Wait for SSM instance to be Online
        run: |
          for i in $(seq 1 30); do
            ONLINE_ID=$(aws ssm describe-instance-information \
              --query "InstanceInformationList[?PingStatus=='Online'].InstanceId" \
              --output text)
            if [ -n "$ONLINE_ID" ]; then
              echo "SSM instance Online: $ONLINE_ID"
              break
            fi
            sleep 10
          done

      - name: Ansible Converge
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          export SSM_S3_BUCKET="acs730-tfstate-${ACCOUNT_ID}"
          ansible-playbook \
            -i assignment2/ansible/inventory/aws_ec2.aws_ec2.yml \
            assignment2/ansible/site.yml
