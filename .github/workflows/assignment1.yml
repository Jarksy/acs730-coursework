name: Assignment 1 CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "assignment1/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=assignment1/terraform/staging init

      - name: Terraform Validate
        run: terraform -chdir=assignment1/terraform/staging validate

      - name: Terraform Apply Staging
        run: terraform -chdir=assignment1/terraform/staging apply -auto-approve

  deploy-prod:
    name: Deploy Prod
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=assignment1/terraform/prod init

      - name: Terraform Validate
        run: terraform -chdir=assignment1/terraform/prod validate

      - name: Terraform Apply Prod
        run: terraform -chdir=assignment1/terraform/prod apply -auto-approve
