---
- name: Configure web server nodes via dynamic inventory
  hosts: "{{ 'all' if lookup('env', 'PACKER_ANSIBLE_CONN') == 'ssh' else 'tag_Role_a2_web' }}"
  become: true
  vars:
    ansible_connection: "{{ lookup('env', 'PACKER_ANSIBLE_CONN') | default('community.aws.aws_ssm', true) }}"
    ansible_aws_ssm_region: us-east-1
    ansible_aws_ssm_bucket_name: "{{ lookup('env', 'SSM_S3_BUCKET') }}"
  roles:
    - role: webserver
